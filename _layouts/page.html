<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">
  {% include meta.html %}
</head>
<body>
  {% include header.html %}

  <!-- 3カラム対応のサイトグリッド -->
  <div class="site-grid">
    <!-- 左：グローバルメニュー（PC時のみ表示） -->
    <aside class="site-left" aria-label="グローバルメニュー">
      <div class="site-left-scroll">
        <nav class="l-nav">
          {% include sidebar.html %}
        </nav>
      </div>
    </aside>

    <!-- 中央：ページ本体 -->
    <main id="main" class="site-main">
      {{ content }}
    </main>

    <!-- 右：アカウント/ショートカット（PCは縦、SPは非表示） -->
    <aside class="site-right" aria-label="アカウント・ショートカット">
      <div class="account-icons">
        <a href="https://keepon.work/claft-" target="_blank" rel="noopener" aria-label="イベントカレンダー" title="イベントカレンダー">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#1f2937"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        {% endraw %}</a>
        <a href="https://claft-next.vercel.app/" target="_blank" rel="noopener" aria-label="アプリを開く" title="アプリを開く">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#34c6be"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>
        {% endraw %}</a>
        <a href="{{ site.baseurl }}/contact/" target="_blank" rel="noopener" aria-label="無料体験 / 問合せ" title="無料体験 / 問合せ">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#273446"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        {% endraw %}</a>
        <hr class="rail-sep" />
        <a href="{{ site.brand.youtube }}" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#111"><path d="M23.5 6.2a4 4 0 0 0-2.8-2.8C18.8 3 12 3 12 3s-6.8 0-8.7.4A4 4 0 0 0 .5 6.2 41.9 41.9 0 0 0 0 12a41.9 41.9 0 0 0 .5 5.8 4 4 0 0 0 2.8 2.8C5.2 21 12 21 12 21s6.8 0 8.7-.4a4 4 0 0 0 2.8-2.8c.3-1.9.5-3.8.5-5.8s-.2-3.9-.5-5.8zM9.6 15.5V8.5L15.8 12l-6.2 3.5z"/></svg>
        {% endraw %}</a>
        <a href="{{ site.brand.note }}" target="_blank" rel="noopener" aria-label="note" title="note">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4"/></svg>
        {% endraw %}</a>
        <a href="{{ site.brand.instagram }}" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><circle cx="17.5" cy="6.5" r="0.5"/></svg>
        {% endraw %}</a>
        <a href="{{ site.brand.line }}" target="_blank" rel="noopener" aria-label="LINE" title="LINE">{% raw %}
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#06c755"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"/></svg>
        {% endraw %}</a>
      </div>
    </aside>
  </div>

  {% include footer.html %}

  <div class="fab"><a href="{{ site.brand.line }}" target="_blank" rel="noopener" aria-label="LINEで相談">LINEで相談</a></div>
  <script src="{{ site.baseurl }}/assets/js/site.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
